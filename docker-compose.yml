# =============================================================================
# CotaG - Stack unica da aplicacao (dev, homologacao e producao)
# =============================================================================
# Este arquivo e o contrato de deploy. Ele NAO contem valores especificos de
# ambiente: as diferencas vem exclusivamente das variaveis configuradas no
# Portainer (ou exportadas no shell local).
#
# - app: Nginx + PHP-FPM no mesmo container, sem portas publicadas no host.
# - worker: mesma imagem, CONTAINER_ROLE=worker, sem rede web.
# - banco: externo a esta stack, acessado por DB_HOST (dominio DNS).
# - NPM: unico ponto HTTP, encaminha para http://cotag-<APP_ENV>-web:<WEB_PORT>.
#
# Guia operacional: docs/deploy/README.md
# =============================================================================

x-app-environment: &app-environment
    # Aplicacao
    APP_ENV: "${APP_ENV:?Defina APP_ENV com dev, homolog ou prod}"
    APP_DEBUG: "${APP_DEBUG:-false}"
    APP_KEY: "${APP_KEY:?Defina APP_KEY (base64:...)}"
    APP_NAME: "${APP_NAME:-CotaG}"
    APP_URL: "${APP_URL:?Defina APP_URL com a URL publica do ambiente}"
    APP_PREVIOUS_KEYS: "${APP_PREVIOUS_KEYS:-}"
    APP_LOCALE: "${APP_LOCALE:-pt_BR}"
    APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-pt_BR}"
    APP_FAKER_LOCALE: "${APP_FAKER_LOCALE:-pt_BR}"
    APP_MAINTENANCE_DRIVER: "${APP_MAINTENANCE_DRIVER:-file}"
    APP_ENV_NATIVE: "${APP_ENV_NATIVE:-}"
    BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
    TZ: "${TZ:-America/Sao_Paulo}"
    WEB_PORT: "${WEB_PORT:-8080}"

    # Logs em stdout/stderr
    LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
    LOG_STACK: "${LOG_STACK:-stderr}"
    LOG_DEPRECATIONS_CHANNEL: "${LOG_DEPRECATIONS_CHANNEL:-null}"
    LOG_LEVEL: "${LOG_LEVEL:-warning}"

    # Banco externo por dominio (nunca um servico Compose)
    DB_CONNECTION: "${DB_CONNECTION:?Defina DB_CONNECTION (mysql, mariadb ou pgsql)}"
    DB_HOST: "${DB_HOST:?Defina DB_HOST com o dominio externo do banco}"
    DB_PORT: "${DB_PORT:?Defina DB_PORT do banco externo}"
    DB_DATABASE: "${DB_DATABASE:?Defina DB_DATABASE}"
    DB_USERNAME: "${DB_USERNAME:?Defina DB_USERNAME}"
    DB_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD}"
    DB_URL: "${DB_URL:-}"
    DATABASE_URL: "${DATABASE_URL:-}"

    # Sessao, cache e filas
    SESSION_DRIVER: "${SESSION_DRIVER:-database}"
    SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
    SESSION_ENCRYPT: "${SESSION_ENCRYPT:-false}"
    SESSION_PATH: "${SESSION_PATH:-/}"
    SESSION_DOMAIN: "${SESSION_DOMAIN:-null}"
    SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
    SESSION_SAME_SITE: "${SESSION_SAME_SITE:-lax}"
    CACHE_STORE: "${CACHE_STORE:-database}"
    QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
    BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-log}"
    FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"

    # Redis (opcional; usado apenas se CACHE_STORE/QUEUE_CONNECTION apontarem)
    REDIS_URL: "${REDIS_URL:-}"
    REDIS_CLIENT: "${REDIS_CLIENT:-phpredis}"
    REDIS_HOST: "${REDIS_HOST:-127.0.0.1}"
    REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
    REDIS_PORT: "${REDIS_PORT:-6379}"

    # Mail
    MAIL_MAILER: "${MAIL_MAILER:-log}"
    MAIL_SCHEME: "${MAIL_SCHEME:-null}"
    MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
    MAIL_PORT: "${MAIL_PORT:-587}"
    MAIL_USERNAME: "${MAIL_USERNAME:-}"
    MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
    MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@example.org}"
    MAIL_FROM_NAME: "${MAIL_FROM_NAME:-CotaG}"

    # AWS / S3 (opcional)
    AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
    AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
    AWS_BUCKET: "${AWS_BUCKET:-}"
    AWS_URL: "${AWS_URL:-}"
    AWS_ENDPOINT: "${AWS_ENDPOINT:-}"
    AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT:-false}"

    # Senha Unica USP
    SENHAUNICA_KEY: "${SENHAUNICA_KEY:-}"
    SENHAUNICA_SECRET: "${SENHAUNICA_SECRET:-}"
    SENHAUNICA_CALLBACK_ID: "${SENHAUNICA_CALLBACK_ID:-}"

    # Replicado USP (SQL Server / FreeTDS)
    REPLICADO_HOST: "${REPLICADO_HOST:-}"
    REPLICADO_PORT: "${REPLICADO_PORT:-1433}"
    REPLICADO_DATABASE: "${REPLICADO_DATABASE:-replicado}"
    REPLICADO_USERNAME: "${REPLICADO_USERNAME:-}"
    REPLICADO_PASSWORD: "${REPLICADO_PASSWORD:-}"
    REPLICADO_CODUNDCLG: "${REPLICADO_CODUNDCLG:-}"
    REPLICADO_SYBASE: "${REPLICADO_SYBASE:-true}"
    REPLICADO_PATHLOG: "${REPLICADO_PATHLOG:-/tmp/replicado.log}"
    REPLICADO_USAR_CACHE: "${REPLICADO_USAR_CACHE:-false}"
    REPLICADO_DEBUG: "${REPLICADO_DEBUG:-false}"
    REPLICADO_DEBUG_LEVEL: "${REPLICADO_DEBUG_LEVEL:-0}"

    # Comportamento do entrypoint
    RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    RUN_SEEDERS: "${RUN_SEEDERS:-false}"
    WARM_CACHE: "${WARM_CACHE:-true}"

    # Backup/restore
    PROJECT_NAME: "${PROJECT_NAME:-cotag}"
    BACKUP_DIR: "${BACKUP_DIR:-/var/www/html/storage/backups}"
    BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"

    CONTAINER_ROLE: app

services:
    # =========================================================================
    # Aplicacao HTTP (Nginx + PHP-FPM)
    # =========================================================================
    app:
        build:
            context: .
            dockerfile: docker/production/Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
                WWWUSER: '${WWWUSER:-1000}'
        image: 'cotag:${APP_VERSION:-latest}'
        restart: unless-stopped
        stop_grace_period: 60s
        environment:
            <<: *app-environment
        expose:
            - '${WEB_PORT:-8080}'
        volumes:
            - storage:/var/www/html/storage
        networks:
            web:
                aliases:
                    - 'cotag-${APP_ENV:?Defina APP_ENV}-web'
        healthcheck:
            test: ['CMD', '/var/www/html/scripts/healthcheck.sh']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 120s

    # =========================================================================
    # Worker de filas (mesma imagem, sem portas e sem rede web)
    # =========================================================================
    worker:
        image: 'cotag:${APP_VERSION:-latest}'
        restart: unless-stopped
        stop_grace_period: 60s
        environment:
            <<: *app-environment
            CONTAINER_ROLE: worker
        volumes:
            - storage:/var/www/html/storage
        depends_on:
            app:
                condition: service_started
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'supervisorctl -c /etc/supervisor/conf.d/supervisord.worker.conf status | grep -q RUNNING',
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 120s

networks:
    web:
        external: true
        name: web

volumes:
    storage:
        driver: local
