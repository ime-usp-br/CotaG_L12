# =============================================================================
# CotaG - Nginx (template)
# =============================================================================
# O entrypoint substitui __WEB_PORT__ por WEB_PORT e grava /etc/nginx/nginx.conf.
# O Nginx roda como www-data (o entrypoint faz drop de privilegios via gosu).
# Logs vao para stdout/stderr; o NPM e o unico ponto HTTP externo.
# =============================================================================

user www-data;
worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr;

events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    server {
        listen __WEB_PORT__;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;
        client_max_body_size 100M;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        # Assets do Vite
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Assets publicados pelo Filament/Livewire
        location /css/ {
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        location /js/ {
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        location /fonts/ {
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 300s;
            fastcgi_read_timeout 300s;
        }

        location ~* ^/storage/.*\.php$ {
            deny all;
            return 404;
        }
    }
}
