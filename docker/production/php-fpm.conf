[www]
; Nginx e PHP-FPM no mesmo container.
; O entrypoint faz drop para www-data; user/group permanecem definidos para
; permitir o `php-fpm -t` executado como root antes do drop.
listen = 127.0.0.1:9000
user = www-data
group = www-data

; Herda todas as variaveis de ambiente do container (Portainer/Compose).
; Necessario para Laravel e para o pacote uspdev/replicado (getenv()).
clear_env = no

pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500

request_terminate_timeout = 300s

catch_workers_output = yes
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; proc_open permanece habilitado (necessario para alguns comandos do Laravel)
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen
